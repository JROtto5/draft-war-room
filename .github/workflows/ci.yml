name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax checks
        run: |
          for f in data.js engine.js core.js views.js wire.js boot.js sw.js; do node --check "$f"; done
      - name: Type-check engine kernel
        run: npx -y -p typescript@5.6.3 tsc --allowJs --checkJs --noEmit --target es2020 engine.js
      - name: HTML sanity
        run: |
          test "$(grep -c '<script src=' index.html)" = "6"
          ! grep -q '<style>' index.html
      - name: Lint & size budgets
        run: node scripts/lint.mjs
      - name: Data tests
        run: node tests/data.test.mjs
      - name: All node suites (with coverage)
        run: |
          node --experimental-test-coverage --test tests/runner.node.mjs 2>/dev/null || true
          ./scripts/test-all.sh
      - name: Benchmark smoke (engine must beat pure-ADP drafter)
        run: node scripts/benchmark.mjs 20
      - name: Marathon (full 192-pick draft)
        run: |
          node tests/build-marathon.mjs
          python3 -m http.server 8766 &
          sleep 1
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          OUT=$("$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=60000 --dump-dom "http://localhost:8766/marathon.html?e2e" | grep -o '<title>MARA|[^<]*' || true)
          echo "marathon: $OUT"
          case "$OUT" in *MARA\|*BAD*|*MARA\|*ERR*|"") exit 1 ;; *) exit 0 ;; esac
      - name: Browser E2E smoke
        run: |
          node tests/build-e2e.mjs
          python3 -m http.server 8765 &
          sleep 1
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          run_e2e() { "$CHROME" --headless --no-sandbox --disable-gpu --disable-background-networking --disable-sync --disable-component-update --virtual-time-budget=50000 --dump-dom "http://localhost:8765/e2e.html?e2e" | grep -o '<title>E2E|[^<]*' || true; }
          OUT=""
          for a in 1 2 3; do
            OUT=$(run_e2e)
            case "$OUT" in *E2E\|*BOOTING*|*E2E\|*BAD*|*E2E\|*ERR*|"") echo "attempt $a: '$OUT' — retrying"; sleep 2;; *E2E\|*) break;; esac
          done
          echo "result: $OUT"
          "$CHROME" --headless --no-sandbox --disable-gpu --window-size=1400,900 --screenshot=e2e-shot.png --timeout=6000 "http://localhost:8765/?e2e" || true
          case "$OUT" in
            *E2E\|*BOOTING*|*E2E\|*BAD*|*E2E\|*ERR*|"") exit 1 ;;
            *E2E\|*) exit 0 ;;
          esac
      - name: Upload E2E screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshot-node${{ matrix.node }}
          path: e2e-shot.png
          if-no-files-found: ignore
