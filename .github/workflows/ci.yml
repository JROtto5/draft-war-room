name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check app.js
          node --check data.js
          node --check sw.js
      - name: HTML sanity
        run: |
          test "$(grep -c '<script src=' index.html)" = "2"
          ! grep -q '<style>' index.html
      - name: Data tests
        run: node tests/data.test.mjs
      - name: Logic tests
        run: node tests/logic.test.mjs
      - name: Browser E2E smoke
        run: |
          node tests/build-e2e.mjs
          python3 -m http.server 8765 &
          sleep 1
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          OUT=$("$CHROME" --headless --no-sandbox --disable-gpu --timeout=12000 --dump-dom http://localhost:8765/e2e.html | grep -o '<title>E2E|[^<]*' || true)
          echo "result: $OUT"
          case "$OUT" in
            *E2E\|*BAD*|*E2E\|*ERR*|"") exit 1 ;;
            *E2E\|*) exit 0 ;;
          esac
